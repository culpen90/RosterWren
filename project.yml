name: RosterWren

options:
  bundleIdPrefix: com.rosterwren
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  RosterWren:
    type: application
    platform: macOS
    sources:
      - path: RosterWren
    info:
      path: RosterWren/Info.plist
      properties:
        CFBundleDisplayName: RosterWren
        CFBundleName: RosterWren
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rosterwren.RosterWren
        PRODUCT_NAME: RosterWren
        ENABLE_APP_SANDBOX: false
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
  RosterWrenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RosterWrenTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rosterwren.RosterWrenTests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: RosterWren

schemes:
  RosterWren:
    build:
      targets:
        RosterWren: all
        RosterWrenTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: RosterWrenTests
